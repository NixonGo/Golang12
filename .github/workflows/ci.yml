name: CI/CD

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:

jobs:
  test:
    name: Test Go App
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - run: go mod tidy
      - run: go test ./...

  docker:
    name: Build and Push Docker
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - run: docker build -t ${{ secrets.DOCKER_USERNAME }}/go-app:${{ github.ref_name }} .
      - run: docker push ${{ secrets.DOCKER_USERNAME }}/go-app:${{ github.ref_name }}
